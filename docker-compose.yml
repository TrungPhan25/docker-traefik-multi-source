services:
  # ============================================
  # TRAEFIK - Reverse Proxy
  # ============================================
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  # ============================================
  # MYSQL - Shared Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USER:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # PHPMYADMIN
  # ============================================
  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`pma.localhost`)"
      - "traefik.http.routers.pma.entrypoints=web"
      - "traefik.http.services.pma-svc.loadbalancer.server.port=80"

  # ============================================
  # PROJECT A - PHP 8.2
  # ============================================
  app-a:
    build:
      context: .
      dockerfile: docker/project-a/Dockerfile
    container_name: app-a
    volumes:
    - ./httpdocs:/var/www/html
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  nginx-a:
    image: nginx:alpine
    container_name: nginx-a
    volumes:
      - ./httpdocs/project-a:/var/www/html
      - ./docker/project-a/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-a
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project-a.rule=Host(`project-a.localhost`)"
      - "traefik.http.routers.project-a.entrypoints=web"
      - "traefik.http.services.project-a-svc.loadbalancer.server.port=80"

  # ============================================
  # PROJECT B - PHP 8.3
  # ============================================
  app-b:
    build:
      context: .
      dockerfile: docker/project-b/Dockerfile
    container_name: app-b
    volumes:
    - ./httpdocs:/var/www/html
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  nginx-b:
    image: nginx:alpine
    container_name: nginx-b
    volumes:
      - ./httpdocs/project-b:/var/www/html
      - ./docker/project-b/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-b
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project-b.rule=Host(`project-b.localhost`)"
      - "traefik.http.routers.project-b.entrypoints=web"
      - "traefik.http.services.project-b-svc.loadbalancer.server.port=80"

# ============================================
# NETWORKS & VOLUMES
# ============================================
networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: